name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # The skill ships a committed bundle, because `npx skills add` copies a
      # directory and runs no build. A generated artefact in the repository
      # without a drift check eventually stops matching its source.
      - run: pnpm check:skill

  # Separate job: a Playwright flake must not mask a type error.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: pw
        run: echo "v=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: pwcache
        with:
          path: ~/.cache/ms-playwright
          # Exact key, no restore-keys: a partial hit would install the wrong
          # browser revision.
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.v }}
      - if: steps.pwcache.outputs.cache-hit != 'true'
        run: pnpm --filter @basilico/web exec playwright install --with-deps chromium
      - if: steps.pwcache.outputs.cache-hit == 'true'
        # System libraries live outside the cache: reinstall even on a hit.
        run: pnpm --filter @basilico/web exec playwright install-deps chromium
      - run: pnpm --filter @basilico/web e2e
      # The extension is tested loaded into a real Chromium: the MV3 wiring
      # (module service worker, alarms, offscreen) only fails at runtime.
      - run: pnpm --filter @basilico/extension build
      - run: pnpm --filter @basilico/extension e2e

      # The loadable package is published on every run: it can be installed from
      # any commit, without waiting for a tagged release.
      - name: Package the extension
        run: cd apps/extension/dist && zip -r ../../../basilico-extension.zip .
      - uses: actions/upload-artifact@v7
        with:
          name: basilico-extension
          path: basilico-extension.zip
          retention-days: 30

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
