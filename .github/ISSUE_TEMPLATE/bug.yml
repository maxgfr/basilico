name: Bug
description: Something doesn't behave the way it should.
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        First things first: **a notification cannot fire once the tab is closed.**
        That's a limit of the web without a server, not a bug — it's explained in the README.

  - type: textarea
    id: what
    attributes:
      label: What happens
      description: And what you expected instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: How to reproduce it
      placeholder: |
        1. Start a focus session
        2. Hide the tab for 10 minutes
        3. Come back
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser and operating system
      placeholder: Firefox 141 on macOS 15
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: How you use it
      options:
        - Browser tab
        - Installed app (PWA)
    validations:
      required: true

  - type: textarea
    id: console
    attributes:
      label: Console errors
      description: Optional, but it helps a lot.
      render: text
