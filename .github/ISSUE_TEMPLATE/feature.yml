name: Idea or improvement
description: Suggest a feature or a change.
labels: ['enhancement']
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What gets in your way today? Describe the situation, not the solution.
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What you'd suggest
    validations:
      required: true

  - type: checkboxes
    id: constraints
    attributes:
      label: Fits the project
      description: basilico is local-first and serverless. Those constraints aren't going to change.
      options:
        - label: My suggestion needs no account, no server and no third-party service.
          required: true
