<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>basilico</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        width: 260px;
        padding: 18px;
        background: #0b0f0e;
        color: #f0f4f1;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: #8b9a92;
      }
      .time {
        font-size: 34px;
        font-weight: 300;
        letter-spacing: -0.02em;
        font-variant-numeric: tabular-nums;
      }
      .mode {
        margin-top: 4px;
        font-size: 13px;
        color: #8b9a92;
      }
      .hint {
        margin: 14px 0 0;
        font-size: 12px;
        line-height: 1.45;
        color: #8b9a92;
      }
      a.button {
        display: block;
        margin-top: 14px;
        padding: 9px 12px;
        border-radius: 8px;
        background: #f0f4f1;
        color: #0b0f0e;
        font-size: 13px;
        font-weight: 500;
        text-align: center;
        text-decoration: none;
      }
      a.button:hover {
        opacity: 0.9;
      }
    </style>
  </head>
  <body>
    <h1>basilico</h1>
    <div id="app"></div>
    <script type="module" src="/src/popup.ts"></script>
  </body>
</html>
